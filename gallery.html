<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3D Project Gallery</title>
<link rel="preload" as="image" href="pn1.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#050508;--surface:#0a0a10;
--text:#f4f4f8;--text-muted:#9a9aab;
--accent:#a78bfa;--accent-cyan:#67e8f9;--accent-magenta:#e879f9;
--accent-soft:rgba(167,139,250,0.35);
}

html{height:100%;}

body{
font-family:'Inter',system-ui,-apple-system,sans-serif;
background:var(--bg);
color:var(--text);
height:100vh;
height:100dvh;               /* real visible height on phones */
overflow:hidden;
display:flex;
flex-direction:column;
justify-content:center;
padding:1.25rem;
padding-bottom:max(1.25rem,env(safe-area-inset-bottom));
position:relative;
}

/* ===== BACKGROUND ===== */
.bg-layer,.orbs-layer,.vignette,.scanlines,.noise,#geometryContainer{
position:fixed;inset:0;z-index:0;pointer-events:none;
}
#geometryContainer{perspective:1200px;}
.orbs-layer{overflow:hidden;}

#ambientLight{
position:fixed;top:-30%;left:50%;transform:translateX(-50%);
width:180%;height:80%;z-index:0;pointer-events:none;opacity:.8;
filter:blur(80px);
animation:ambientShift 15s ease-in-out infinite;
}
@keyframes ambientShift{
0%,100%{transform:translateX(-50%) translateY(0);opacity:.8;}
50%{transform:translateX(-48%) translateY(-15px);opacity:.95;}
}

#particleCanvas{position:fixed;top:0;left:0;z-index:1;pointer-events:none;}

.geometric-shape{position:absolute;filter:drop-shadow(0 0 20px rgba(167,139,250,.3));}

.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.2;animation:floatOrb 20s ease-in-out infinite;}
.orb:nth-child(1){width:400px;height:400px;background:rgba(167,139,250,.8);top:5%;left:10%;animation-duration:25s;}
.orb:nth-child(2){width:350px;height:350px;background:rgba(34,211,238,.6);top:50%;right:5%;animation-duration:22s;animation-delay:-7s;}
.orb:nth-child(3){width:320px;height:320px;background:rgba(232,121,249,.5);bottom:10%;left:20%;animation-duration:28s;animation-delay:-12s;}
.orb:nth-child(4){width:380px;height:380px;background:rgba(129,140,248,.4);top:20%;right:15%;animation-duration:26s;animation-delay:-5s;}
@keyframes floatOrb{
0%,100%{transform:translate(0,0) scale(1);}
25%{transform:translate(50px,-40px) scale(1.1);}
50%{transform:translate(-30px,30px) scale(.95);}
75%{transform:translate(40px,20px) scale(1.05);}
}

.vignette{
background:
radial-gradient(ellipse 85% 75% at 50% 40%,transparent 15%,rgba(5,5,8,.4) 100%),
radial-gradient(ellipse 100% 50% at 50% 100%,rgba(5,5,8,.9) 0%,transparent 70%);
}
.scanlines{
background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.01) 2px,rgba(255,255,255,.01) 4px);
opacity:.3;
}
.noise{
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
opacity:.4;
}

/* ===== HEADER ===== */
header,.gallery-container{position:relative;z-index:2;}

header{
text-align:center;
margin-bottom:1.25rem;
opacity:0;transform:translateY(24px);
animation:enterUp .9s cubic-bezier(.22,1,.36,1) .2s forwards;
}

h1{
font-size:clamp(1.8rem,5vw,3rem);
font-weight:700;
letter-spacing:-1.2px;
margin-bottom:.5rem;
background:linear-gradient(135deg,#fff 0%,#e0e0f0 40%,#c4b5fd 70%,#a5f3fc 100%);
-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 32px rgba(167,139,250,.35));
}

.subtitle{color:var(--text-muted);font-size:clamp(.95rem,2.5vw,1.08rem);max-width:540px;margin:0 auto;opacity:.9;}

.gallery-container{
max-width:1120px;width:100%;margin:0 auto;
flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;
opacity:0;transform:translateY(32px);
animation:enterUp .95s cubic-bezier(.22,1,.36,1) .4s forwards;
}

@keyframes enterUp{to{opacity:1;transform:translateY(0);}}

/* ===== IMAGE STAGE ===== */
.main-image-wrapper{
position:relative;
width:100%;
height:clamp(200px,calc(100vh - 310px),600px);
height:clamp(200px,calc(100dvh - 310px),600px);
border-radius:24px;
overflow:hidden;
background:var(--surface);
box-shadow:0 0 0 1px rgba(255,255,255,.1),0 8px 40px rgba(0,0,0,.6),0 0 100px rgba(167,139,250,.2);
isolation:isolate;
touch-action:pan-y;           /* lets us detect horizontal swipes */
}

.main-image-wrapper::before{
content:'';position:absolute;inset:0;border-radius:inherit;padding:2px;
background:linear-gradient(145deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.1) 20%,transparent 40%,transparent 60%,rgba(167,139,250,.5) 80%,rgba(34,211,238,.3) 100%);
-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;
pointer-events:none;z-index:3;
}

.main-image{
position:absolute;inset:0;width:100%;height:100%;
object-fit:contain;object-position:center;
opacity:0;transform:scale(1.04);
transition:opacity .45s ease,transform .6s cubic-bezier(.22,1,.36,1);
background:#08080e;
}
.main-image.active{opacity:1;transform:scale(1);}

.loading-overlay{
position:absolute;inset:0;
background:rgba(6,6,10,.85);
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:1rem;padding:1rem;text-align:center;
color:var(--text-muted);font-size:.95rem;font-weight:500;
pointer-events:none;
transition:opacity .35s ease;
opacity:1;z-index:2;
}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.loading-overlay.error{cursor:pointer;pointer-events:auto;color:#fca5a5;}
.loading-overlay.error .spinner{display:none;}

.spinner{
width:40px;height:40px;
border:3px solid rgba(255,255,255,.08);
border-top-color:var(--accent);
border-right-color:var(--accent-cyan);
border-bottom-color:var(--accent-magenta);
border-radius:50%;
animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== CONTROLS ===== */
.controls{
display:flex;justify-content:center;align-items:center;
gap:1.25rem;margin:1.25rem 0 .6rem;flex-wrap:wrap;
opacity:0;transform:translateY(16px);
animation:enterUp .8s cubic-bezier(.22,1,.36,1) .6s forwards;
}

.btn{
min-height:48px;
min-width:130px;
padding:.8rem 1.8rem;
font-size:.98rem;font-weight:600;font-family:inherit;
border:1px solid rgba(255,255,255,.2);
background:linear-gradient(180deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 100%);
color:var(--text);
border-radius:999px;
cursor:pointer;
transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
-webkit-tap-highlight-color:transparent;
box-shadow:0 4px 15px rgba(0,0,0,.4),0 0 30px rgba(167,139,250,.1);
}
.btn:hover:not(:disabled){
border-color:rgba(167,139,250,.6);
transform:translateY(-3px);
box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 40px rgba(167,139,250,.3);
}
.btn:active:not(:disabled){transform:scale(.97);}
.btn:disabled{opacity:.25;cursor:not-allowed;box-shadow:none;}

.counter{
text-align:center;color:var(--text-muted);
font-size:.98rem;font-weight:600;letter-spacing:1.6px;
font-variant-numeric:tabular-nums;
opacity:0;animation:enterUp .7s ease .75s forwards;
}
.counter span{color:var(--text);font-weight:700;}

.hint{
text-align:center;margin-top:.8rem;font-size:.78rem;
color:rgba(154,154,171,.5);letter-spacing:.6px;
opacity:0;animation:enterUp .7s ease .9s forwards;
}
.hint kbd{
display:inline-block;padding:.14rem .45rem;margin:0 .18rem;font-size:.72rem;font-family:inherit;
background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;
}

/* ===== PHONES: lighter effects + safe sizing ===== */
@media (max-width:640px){
body{padding:.85rem;padding-bottom:max(.85rem,env(safe-area-inset-bottom));}
header{margin-bottom:.8rem;}
.main-image-wrapper{
border-radius:18px;
height:clamp(200px,calc(100vh - 270px),520px);
height:clamp(200px,calc(100dvh - 270px),520px);
}
.controls{gap:.9rem;margin-top:1rem;}
.btn{flex:1;min-width:0;max-width:180px;}
.hint,.orb,#geometryContainer{display:none;}
#ambientLight{animation:none;filter:blur(40px);}
.noise{display:none;}
h1{filter:none;}
}

@media (prefers-reduced-motion:reduce){
*{animation:none !important;transition:none !important;}
header,.gallery-container,.controls,.counter,.hint{opacity:1 !important;transform:none !important;}
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-layer">
<svg id="ambientLight" viewBox="0 0 1200 800">
<defs>
<radialGradient id="grad1" cx="50%" cy="50%" r="60%">
<stop offset="0%" style="stop-color:rgba(167,139,250,0.4)"/>
<stop offset="50%" style="stop-color:rgba(167,139,250,0.1)"/>
<stop offset="100%" style="stop-color:rgba(167,139,250,0)"/>
</radialGradient>
<radialGradient id="grad2" cx="50%" cy="50%" r="60%">
<stop offset="0%" style="stop-color:rgba(103,232,249,0.3)"/>
<stop offset="60%" style="stop-color:rgba(103,232,249,0.05)"/>
<stop offset="100%" style="stop-color:rgba(103,232,249,0)"/>
</radialGradient>
<radialGradient id="grad3" cx="50%" cy="50%" r="60%">
<stop offset="0%" style="stop-color:rgba(232,121,249,0.25)"/>
<stop offset="50%" style="stop-color:rgba(232,121,249,0.05)"/>
<stop offset="100%" style="stop-color:rgba(232,121,249,0)"/>
</radialGradient>
</defs>
<ellipse cx="200" cy="150" rx="300" ry="350" fill="url(#grad1)"/>
<ellipse cx="1000" cy="600" rx="280" ry="320" fill="url(#grad2)"/>
<ellipse cx="600" cy="200" rx="320" ry="280" fill="url(#grad3)"/>
</svg>
</div>

<canvas id="particleCanvas"></canvas>
<div id="geometryContainer"></div>

<div class="orbs-layer">
<div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div>
</div>

<div class="vignette"></div>
<div class="scanlines"></div>
<div class="noise"></div>

<!-- Content -->
<header>
<h1>Project Gallery</h1>
<p class="subtitle">Explore our creative universe</p>
</header>

<div class="gallery-container">

<div class="main-image-wrapper" id="imageWrapper">
<img class="main-image" id="mainImg" alt="Project image" decoding="async">
<div class="loading-overlay" id="loader">
<div class="spinner"></div>
<span id="loaderText">Loading...</span>
</div>
</div>

<div class="controls">
<button class="btn" id="prevBtn" disabled>← Previous</button>
<button class="btn" id="nextBtn">Next →</button>
</div>

<div class="counter" id="counter"><span>1</span> / 76</div>
<p class="hint">Use <kbd>←</kbd> <kbd>→</kbd> arrow keys to navigate</p>

</div>

<script>
/* =====================================================
   GALLERY (runs first, so the image gets priority)
   - Only ONE image is on screen / in memory at a time
   - Next, previous and +2 are preloaded AFTER the current one is shown
   - Failed images retry automatically, then show "Tap to retry"
   - Swipe left / right on phones, arrow keys on desktop
   ===================================================== */
const files = [];
for (let i = 1; i <= 27; i++) files.push('pn' + i + '.jpeg');
for (let i = 1; i <= 49; i++) files.push('p' + i + '.jpeg');

const mainImg    = document.getElementById('mainImg');
const loader     = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const counterEl  = document.getElementById('counter');
const prevBtn    = document.getElementById('prevBtn');
const nextBtn    = document.getElementById('nextBtn');
const wrapper    = document.getElementById('imageWrapper');

let current = 0;
let token = 0;                 // ignores results of outdated taps
const cache = new Map();       // index -> Promise<Image>

function fetchImage(idx, attempt = 0) {
  if (attempt === 0 && cache.has(idx)) return cache.get(idx);

  const p = new Promise((resolve, reject) => {
    const im = new Image();
    im.decoding = 'async';
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('load failed'));
    im.src = files[idx] + (attempt ? '?r=' + attempt + '_' + Date.now() : '');
  }).catch(err => {
    if (attempt < 2) {
      return new Promise(r => setTimeout(r, 700 * (attempt + 1)))
        .then(() => fetchImage(idx, attempt + 1));
    }
    cache.delete(idx);
    throw err;
  });

  if (attempt === 0) cache.set(idx, p);
  return p;
}

function trimCache(idx) {            // free memory on small phones
  for (const k of Array.from(cache.keys())) {
    if (k < idx - 2 || k > idx + 3) cache.delete(k);
  }
}

function setLoader(show, msg, isError) {
  loader.classList.toggle('hidden', !show);
  loader.classList.toggle('error', !!isError);
  if (msg) loaderText.textContent = msg;
}

function showImage(idx) {
  if (idx < 0 || idx >= files.length) return;

  current = idx;
  const t = ++token;

  counterEl.innerHTML = '<span>' + (idx + 1) + '</span> / ' + files.length;
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === files.length - 1;

  mainImg.classList.remove('active');
  setLoader(true, 'Loading...', false);
  trimCache(idx);

  fetchImage(idx)
    .then(im => {
      if (t !== token) return false;
      mainImg.alt = 'Project ' + (idx + 1);
      mainImg.src = im.src;
      const ready = mainImg.decode ? mainImg.decode() : Promise.resolve();
      return ready.catch(() => {}).then(() => t === token);
    })
    .then(ok => {
      if (!ok) return;
      mainImg.classList.add('active');
      setLoader(false);
      startEffects();
      [1, -1, 2].forEach(d => {           // preload neighbours, one after another is not needed: current is done
        const j = idx + d;
        if (j >= 0 && j < files.length) fetchImage(j).catch(() => {});
      });
    })
    .catch(() => {
      if (t !== token) return;
      setLoader(true, 'Could not load this image. Tap to retry.', true);
    });
}

loader.addEventListener('click', () => {
  if (loader.classList.contains('error')) showImage(current);
});

prevBtn.addEventListener('click', () => showImage(current - 1));
nextBtn.addEventListener('click', () => showImage(current + 1));

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  showImage(current - 1);
  if (e.key === 'ArrowRight') showImage(current + 1);
});

/* swipe */
let sx = 0, sy = 0;
wrapper.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });
wrapper.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    showImage(current + (dx < 0 ? 1 : -1));
  }
}, { passive: true });

showImage(0);

/* =====================================================
   BACKGROUND EFFECTS - started only after the first image
   is on screen, and kept light on phones
   ===================================================== */
const isSmall = window.innerWidth <= 640;
let fxStarted = false;

function startEffects() {
  if (fxStarted) return;
  fxStarted = true;
  new ParticleSystem('particleCanvas');
  if (!isSmall) { startShapes(); startTilt(); }
}
setTimeout(startEffects, 4000);   // safety net

class ParticleSystem {
  constructor(id) {
    this.c = document.getElementById(id);
    this.ctx = this.c.getContext('2d');
    this.dpr = Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 2);
    this.colors = [[167,139,250],[103,232,249],[232,121,249],[129,140,248],[94,234,212]];
    this.mouse = { x: -9999, y: -9999 };
    this.ps = [];
    this.raf = 0;
    this.lastW = window.innerWidth;
    this.resize();

    const n = Math.min(isSmall ? 35 : 150, Math.floor((this.w * this.h) / 8000));
    for (let i = 0; i < n; i++) this.ps.push(this.make());

    window.addEventListener('mousemove', e => { this.mouse.x = e.clientX; this.mouse.y = e.clientY; });
    window.addEventListener('resize', () => {
      if (window.innerWidth !== this.lastW) { this.lastW = window.innerWidth; this.resize(); }
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !this.raf) this.loop(); });
    this.loop();
  }

  resize() {
    this.w = window.innerWidth;
    this.h = window.innerHeight;
    this.c.width = this.w * this.dpr;
    this.c.height = this.h * this.dpr;
    this.c.style.width = this.w + 'px';
    this.c.style.height = this.h + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  make() {
    const depth = 0.2 + Math.random() * 0.8;
    const a = Math.random() * Math.PI * 2;
    const sp = 0.2 + Math.random() * 0.6;
    return {
      x: Math.random() * this.w, y: Math.random() * this.h,
      vx: Math.cos(a) * sp * depth, vy: Math.sin(a) * sp * depth - 0.15,
      size: (8 + Math.random() * 28) * depth, depth,
      color: this.colors[Math.floor(Math.random() * this.colors.length)],
      alpha: 0.05 + Math.random() * 0.25 * depth,
      pulse: Math.random() * Math.PI * 2
    };
  }

  loop() {
    this.raf = 0;
    if (document.hidden) return;

    const ctx = this.ctx, m = 100;
    ctx.clearRect(0, 0, this.w, this.h);

    for (const p of this.ps) {
      const dx = p.x - this.mouse.x, dy = p.y - this.mouse.y;
      const d = Math.hypot(dx, dy);
      if (d < 250) {
        const f = (1 - d / 250) * 0.4, an = Math.atan2(dy, dx);
        p.vx += Math.cos(an) * f; p.vy += Math.sin(an) * f;
      }
      p.vx *= 0.988; p.vy *= 0.988;
      p.x += p.vx;   p.y += p.vy;
      p.pulse += 0.016;

      if (p.y < -m) p.y = this.h + m;
      if (p.y > this.h + m) p.y = -m;
      if (p.x < -m) p.x = this.w + m;
      if (p.x > this.w + m) p.x = -m;

      const [r, g, b] = p.color;
      const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse)) * (0.6 + 0.4 * (1 - p.depth));
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size / 2);
      grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',1)');
      grad.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',0.6)');
      grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
      ctx.globalAlpha = a;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    this.raf = requestAnimationFrame(() => this.loop());
  }
}

/* floating triangles - desktop only */
function startShapes() {
  const box = document.getElementById('geometryContainer');
  const cols = ['rgba(167,139,250,0.8)','rgba(103,232,249,0.8)','rgba(232,121,249,0.8)','rgba(129,140,248,0.8)'];
  const shapes = [];

  for (let i = 0; i < 6; i++) {
    const size = 40 + Math.random() * 80;
    const col = cols[Math.floor(Math.random() * cols.length)];
    const el = document.createElement('div');
    el.className = 'geometric-shape';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100">' +
      '<path d="M50,10 L90,90 L10,90 Z" fill="' + col + '" fill-opacity="0.35" stroke="' + col + '" stroke-width="2"/></svg>';
    box.appendChild(el);
    shapes.push({
      el, x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
      t: 0, dur: 8 + Math.random() * 6,
      rx: Math.random() * 6, ry: Math.random() * 6, rz: Math.random() * 6,
      sx: (Math.random() - 0.5) * 0.005, sy: (Math.random() - 0.5) * 0.005, sz: (Math.random() - 0.5) * 0.005
    });
  }

  (function tick() {
    if (!document.hidden) {
      for (const s of shapes) {
        s.t += 0.016; s.rx += s.sx; s.ry += s.sy; s.rz += s.sz;
        const pr = (s.t % s.dur) / s.dur, w = Math.sin(pr * Math.PI * 2);
        s.el.style.transform = 'translate(' + s.x + 'px,' + (s.y + w * 30) + 'px) rotateX(' + s.rx +
          'rad) rotateY(' + s.ry + 'rad) rotateZ(' + s.rz + 'rad) scale(' + (0.8 + w * 0.2) + ')';
        s.el.style.opacity = 0.4 + 0.3 * w;
      }
    }
    requestAnimationFrame(tick);
  })();
}

/* subtle tilt - only for devices with a real mouse */
function startTilt() {
  if (!window.matchMedia('(hover: hover)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let tx = 0, ty = 0, cx = 0, cy = 0;
  document.addEventListener('mousemove', e => {
    const r = wrapper.getBoundingClientRect();
    tx = (e.clientX - (r.left + r.width / 2)) / r.width * 8;
    ty = (e.clientY - (r.top + r.height / 2)) / r.height * 5;
  });
  (function tick() {
    cx += (tx - cx) * 0.1;
    cy += (ty - cy) * 0.1;
    wrapper.style.transform = 'perspective(1200px) rotateY(' + cx + 'deg) rotateX(' + (-cy) + 'deg)';
    requestAnimationFrame(tick);
  })();
}
</script>

</body>
</html>
